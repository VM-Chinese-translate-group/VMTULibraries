plugins {
    id 'com.gradleup.shadow'
}

base.archivesName = "${libs.versions.core.name.get()}-${project.name}"
group = "${libs.versions.core.group.get()}.${project.name}"
version = libs.versions.core.version.get()

dependencies {
    implementation project(':common')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact shadowJar
        }
    }

    repositories {
    }
}

shadowJar {
    minimize()
    relocate("com.google.archivepatcher", "include.com.google.archivepatcher")
    dependencies {
        include(dependency('net.runelite.archive-patcher:archive-patcher-applier:.*'))
    }
    exclude 'LICENSE'
    archiveClassifier.set('')
}

jar {
    archiveClassifier.set('raw')
}

// Dependency-free deterministic regression test, also run by check.
tasks.register('mirrorProbeRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'top.vmctcn.vmtu.libraries.resourcepack.util.MirrorProbeSelectorTest'
}
tasks.named('check') { dependsOn tasks.named('mirrorProbeRegression') }

// The standalone regression is executed by mirrorProbeRegression, not by a test framework.
// Gradle 9 otherwise fails when test sources exist but no framework tests are discovered.
tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
    dependsOn tasks.named('mirrorProbeRegression')
}
